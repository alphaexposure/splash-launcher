name: Bug report
description: Something in Splash Launcher doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems should be reported privately instead: see
        [SECURITY.md](https://github.com/alphaexposure/splash-launcher/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: Splash Launcher version
      description: The release you downloaded (for example 0.1.0), or the commit you built from.
    validations:
      required: true
  - type: input
    id: splash-version
    attributes:
      label: Splash-M1 version
      description: For example 1.1.0-m1.
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      description: Chip, memory and macOS version, for example "M1 Pro, 32 GB, macOS 15.4".
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output (optional)
      description: |
        Relevant lines from the Logs page (use Copy). Splash prints file paths that include your
        Mac username, such as /Users/yourname/..., so please replace your username before posting.
        API keys are already redacted by the launcher.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed my username and any other personal details from what I pasted.
          required: true
